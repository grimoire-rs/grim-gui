# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  REPORTS_ROOT: '{{.ROOT_DIR}}/target/reports'

includes:
  git: ./taskfiles/git.taskfile.yml
  rust: ./taskfiles/rust.taskfile.yml
  shell: ./taskfiles/shell.taskfile.yml
  web: ./taskfiles/web.taskfile.yml
  ci: ./taskfiles/ci.taskfile.yml
  coverage: ./taskfiles/coverage.taskfile.yml
  gui: ./taskfiles/gui.taskfile.yml
  docs: ./taskfiles/docs.taskfile.yml
  claude:
    taskfile: ./.claude/taskfile.yml
    dir: ./.claude
  test:
    taskfile: ./test/taskfile.yml
    dir: ./test

tasks:
  check:
    desc: Type-check the Rust workspace (in the build container)
    cmd: '{{.ROOT_DIR}}/scripts/in-container.sh cargo check --workspace'

  run:
    desc: Run the app against the dev server (pass args after --)
    cmd: ocx exec -- npm run tauri dev -- {{.CLI_ARGS}}

  default:
    desc: Fast check (format, clippy, type-check)
    cmds:
      - task: rust:format:check
      - task: rust:clippy:check
      - task: check

  # Shared internal helper (called by subsystem taskfiles via :prefix).
  # Convention: dot-prefix (.name) for internal tasks, like GitLab CI hidden jobs.
  .ensure-cargo-tool:
    internal: true
    status:
      - '{{.TOOL}} --version'
    cmds:
      - cargo install --locked {{.CRATE | default .TOOL}}

  # Two-phase verify: parallel lint, then sequential build+test.
  verify:
    desc: Full quality gate
    summary: |
      Phase 1 (parallel): format, clippy, shell lint, claude verify, web type-check, workflow lint, docs check
      Phase 2 (sequential): build, unit tests, web tests, acceptance tests
      Rust and acceptance steps run in the build container (docker/linux-build.Dockerfile).
      Use `task --force verify` to bypass caching.
    cmds:
      - task: .verify:lint
      - task: .verify:build-test
      - task: .verify:mark

  .verify:mark:
    internal: true
    desc: Mark commit-verified state for the pre-commit hook.
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.claude/hooks/.state
      - date +%s > {{.ROOT_DIR}}/.claude/hooks/.state/commit-verified

  .verify:lint:
    internal: true
    deps:
      - task: rust:format:check
      - task: rust:clippy:check
      - task: shell:verify
      - task: claude:verify
      - task: web:lint
      - task: ci:lint
      - task: docs:check

  .verify:build-test:
    internal: true
    cmds:
      - task: rust:build
      - task: rust:test:unit
      - task: web:test
      - task: test:accept
