name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Start `grim gui` (or `grim-gui`)
        2. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, grim version (`grim --version`), grim-gui version.
      placeholder: |
        - OS: macOS 15.2 (arm64)
        - grim: 0.17.0
        - grim-gui: 0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant output (the app writes one `grim-gui: <command> <outcome>` line per call to stderr; start it from a terminal).
      render: text
