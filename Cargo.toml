[workspace]
members = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The grim-sdk crate lives in the grimoire repository, pinned by revision.
[workspace.dependencies]
grim-sdk = { git = "https://github.com/grimoire-rs/grimoire", rev = "82f4982ed4dac5aaab7f7ba006525b9f01a5cfdb" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
