[workspace]
members = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Local override (the repository split's GD-3): resolves through a symlink kept
# outside both repositories. The pin step replaces this with a git rev.
[workspace.dependencies]
grim-sdk = { path = "../.grimoire-split/crates/grim-sdk" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
