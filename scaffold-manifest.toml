[[deviation]]
what = "S-007 asserts `failed code=69`, not `failed code=78`"
reason = "grim-sdk maps every exit code outside 69, 74, 75, 80 and 81 to 69 'unexpected output' (C-004), so a fake grim exiting 78 surfaces as code 69 with 78 in the message."

[[deviation]]
what = "`cargo build --release` for grim-gui passes `--features custom-protocol` (feature added to src-tauri/Cargo.toml)"
reason = "A release build without the feature loads devUrl instead of the embedded front end, so the acceptance run saw no IPC call; `tauri build` enables it itself."

[[deviation]]
what = "`taskfiles/rust.taskfile.yml` and `test/taskfile.yml` run cargo and pytest through scripts/in-container.sh unless CI is set"
reason = "PD-13: the host has no webkit2gtk; CI sets CI=true and calls cargo directly."

[[deviation]]
what = "the CSP in src-tauri/tauri.conf.json is extended beyond C-032 with `object-src 'none'; base-uri 'none'; form-action 'none'`"
reason = "Hardening from review: the pinned directives leave plugin objects, base-URL rewriting and form posts to the defaults."

[[deviation]]
what = "ED-8: `@tauri-apps/*` npm packages are pinned at 2.12.4 while the tauri crate is 2.12.5"
reason = "npm 2.12.5 is under two weeks old on 2026-11-26, and the dependency age floor outranks matching the crate patch version."

