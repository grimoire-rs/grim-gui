[package]
name = "grim-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop front end of grim"
publish = false

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "grim_gui_lib"
crate-type = ["rlib"]

[features]
# `tauri build` turns this on; a plain `cargo build --release` must pass it, or the
# binary loads the dev server URL instead of the embedded front end.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = "=2.12.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grim-sdk.workspace = true

[dev-dependencies]
tempfile = "3"
toml = "1.2"

[lints]
workspace = true
