# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  lint:
    desc: Lint the GitHub Actions workflows with actionlint
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        if ! ls .github/workflows/*.yml >/dev/null 2>&1; then
          echo "no workflows to lint"
          exit 0
        fi
        ocx exec -- actionlint
